#
# ns8-qbittorrent state/backup include patterns for Restic
#
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# Only patterns referring to Podman named volumes and to the agent state/
# directory are considered by the backup engine. The module state/environment
# file is always included by the core, so it does not need to be listed here.
#
# The qBittorrent configuration volume holds the application settings, the
# WebUI credentials and the torrent session state (.torrent files, resume
# data, categories), so it is the only thing worth saving.
#
volumes/qbittorrent-config

# Downloaded data is deliberately NOT backed up: it can easily reach
# hundreds of gigabytes, it is re-downloadable by design, and when the
# administrator points the downloads directory at a host path the backup
# engine cannot reach it at all. Back that directory up separately if it
# matters.
