name: "Clean up registry"

on:
  delete:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete_images:
    name: "Delete ghcr.io images ${{ github.event.ref }}"
    runs-on: ubuntu-latest
    environment: Registry
    steps:
      - uses: NethServer/ns8-github-actions/.github/actions/delete-image@v1
        with:
          # Must match the image name built by build-images.sh, otherwise
          # deleting a branch leaves its image tag behind in ghcr.io.
          images: "ns8-qbittorrent"
          delete_image_token: ${{ secrets.IMAGES_CLEANUP_TOKEN }}
